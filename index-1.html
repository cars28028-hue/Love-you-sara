<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هدية لسارا 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{kitty:'#ffb6c1',lace:'#fff0f5',neon:'#ff4fa3',ink:'#7a2e52'},fontFamily:{cute:['"Baloo Bhaijaan 2"','Tahoma','sans-serif']}}}}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#fff0f5;--bg2:#ffd3e3;--card:rgba(255,255,255,.72);--ink:#7a2e52;--bd:#ffb6c1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#2b1020;--bg2:#4a1d38;--card:rgba(60,25,48,.72);--ink:#ffd6e8;--bd:#d46a96}}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 10%,var(--bg1),var(--bg2));color:var(--ink);font-family:'Baloo Bhaijaan 2',Tahoma,sans-serif;overflow:hidden}
.paper{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:3px dashed var(--bd);border-radius:2rem;box-shadow:8px 8px 0 rgba(255,182,193,.55),0 20px 50px rgba(255,79,163,.25)}
.glitch{text-shadow:2px 0 rgba(255,0,120,.55),-2px 0 rgba(0,200,255,.5),0 0 18px rgba(255,79,163,.6);animation:fl 3.2s infinite}
@keyframes fl{0%,88%,100%{transform:none;text-shadow:2px 0 rgba(255,0,120,.55),-2px 0 rgba(0,200,255,.5),0 0 18px rgba(255,79,163,.6)}90%{transform:translateX(3px) skewX(-4deg);text-shadow:-5px 0 rgba(255,0,120,.7),5px 0 rgba(0,200,255,.7)}93%{transform:translateX(-3px);opacity:.8}96%{transform:none;opacity:1}}
.btn{font-weight:800;border-radius:9999px;padding:.6rem 2rem;font-size:1.25rem;border:3px solid #fff;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff8fc0,#ff4fa3);box-shadow:0 5px 0 #d6317f,0 10px 22px rgba(255,79,163,.4)}
.btn.alt{background:linear-gradient(135deg,#fff,#ffdbe8);color:#b3376f;border-color:#ffb6c1;box-shadow:0 5px 0 #f4a0bf,0 10px 20px rgba(255,182,193,.5)}
.btn:hover{filter:drop-shadow(0 0 12px #ff4fa3)}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;z-index:50}
</style>
</head>
<body>
<div id="root"></div><div class="scan"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const FM=window.Motion||{};
const motion=FM.motion||new Proxy({},{get:(_,t)=>({children,initial,animate,exit,transition,whileHover,whileTap,layoutId,layout,variants,...p})=>React.createElement(t,p,children)});
const AnimatePresence=FM.AnimatePresence||(({children})=>children);
const VIDEO="video.mp4";

function Cat({className=''}){return(
<svg viewBox="0 0 120 110" className={className} fill="none" stroke="#7a2e52" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
<path d="M20 40 L18 8 L48 24 Q60 21 72 24 L102 8 L100 40 Q108 62 92 85 Q60 105 28 85 Q12 62 20 40Z" fill="#fff"/>
<ellipse cx="44" cy="55" rx="4" ry="6" fill="#7a2e52"/><ellipse cx="76" cy="55" rx="4" ry="6" fill="#7a2e52"/>
<ellipse cx="60" cy="66" rx="4" ry="3" fill="#ff8fc0"/><path d="M60 69 Q54 78 48 72M60 69 Q66 78 72 72"/>
<path d="M22 62 L4 58M22 70 L4 74M98 62 L116 58M98 70 L116 74" strokeWidth="2.5"/>
<path d="M88 22 q8 -14 18 -6 q-6 14 -18 6z M88 22 q-4 -16 -16 -10 q6 14 16 10z" fill="#ff4fa3"/>
<circle cx="88" cy="22" r="4" fill="#ffb6c1"/><circle cx="34" cy="68" r="6" fill="#ffb6c1" stroke="none" opacity=".7"/><circle cx="86" cy="68" r="6" fill="#ffb6c1" stroke="none" opacity=".7"/>
</svg>)}

function Floaters(){
  const items=useMemo(()=>Array.from({length:22},(_,i)=>({i,x:Math.random()*100,s:14+Math.random()*26,d:9+Math.random()*10,delay:-Math.random()*14,star:i%3===0,r:(Math.random()-.5)*50})),[]);
  return <div className="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    {items.map(o=><motion.div key={o.i} className="absolute select-none" style={{left:o.x+'%',fontSize:o.s,color:o.star?'#ffe27a':'#ff4fa3',filter:`drop-shadow(0 0 8px ${o.star?'#ffd84d':'#ff4fa3'})`,bottom:-60}}
      animate={{y:[0,-1300],x:[0,o.r,-o.r,0],rotate:[0,o.r*2],opacity:[0,.9,.9,0]}} transition={{duration:o.d,repeat:Infinity,delay:o.delay,ease:'linear'}}>{o.star?'★':'♥'}</motion.div>)}
  </div>;
}

function useLofi(){
  const [on,setOn]=useState(false);const ref=useRef(null);
  useEffect(()=>{
    if(!on){ if(ref.current){ref.current.master.gain.linearRampToValueAtTime(0,ref.current.ctx.currentTime+.4);const c=ref.current;setTimeout(()=>{clearInterval(c.t);c.ctx.close()},500);ref.current=null} return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=new AC(),master=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
    master.gain.value=0;master.gain.linearRampToValueAtTime(.18,ctx.currentTime+1);master.connect(lp);lp.connect(ctx.destination);
    const chords=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,392]];let n=0;
    const play=()=>{const t=ctx.currentTime;chords[n++%4].forEach(f=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;o.detune.value=(Math.random()-.5)*14;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.8);g.gain.linearRampToValueAtTime(0,t+3.8);o.connect(g);g.connect(master);o.start(t);o.stop(t+4)})};
    play();const timer=setInterval(play,3500);ref.current={ctx,master,t:timer};
    return()=>{};
  },[on]);
  return [on,setOn];
}

const pop={initial:{opacity:0,scale:.7,y:20,filter:'blur(6px)'},animate:{opacity:1,scale:1,y:0,filter:'blur(0px)'},exit:{opacity:0,scale:.8,x:[0,-12,12,0],filter:'blur(8px)'},transition:{type:'spring',stiffness:260,damping:18}};
function Btn({children,alt,onClick,layoutId,style,animate,transition}){
  return <motion.button layoutId={layoutId} layout={!!layoutId} className={'btn '+(alt?'alt':'')} onClick={onClick} style={style} animate={animate} transition={transition}
    whileHover={{scale:1.12,rotate:-3}} whileTap={{scale:.88}}>{children}</motion.button>;
}
function Title({children,shake}){
  return <motion.h1 key={String(children)} {...pop} animate={shake?{...pop.animate,x:[0,-10,10,-8,8,0]}:pop.animate} className="glitch text-3xl sm:text-5xl font-extrabold leading-snug text-center text-ink" style={{color:'var(--ink)'}}>{children}</motion.h1>;
}

function VideoBox(){
  const v=useRef(null);
  useEffect(()=>{const e=v.current;if(e){const p=e.play();p&&p.catch&&p.catch(()=>{})}},[]);
  return <motion.div {...pop} className="w-full flex flex-col items-center gap-3">
    <h2 className="glitch text-2xl sm:text-3xl font-extrabold">هديتك 💌</h2>
    <div className="relative p-2 rounded-3xl bg-white/80" style={{border:'4px solid #ffb6c1',boxShadow:'0 0 40px rgba(255,79,163,.6),6px 6px 0 #ffb6c1'}}>
      <video ref={v} src={VIDEO} controls playsInline loop className="rounded-2xl bg-black block w-full" style={{maxHeight:'62vh',aspectRatio:'9/16',maxWidth:'100%'}}/>
      <span className="absolute -top-4 -right-3 text-3xl">🎀</span><span className="absolute -bottom-4 -left-3 text-3xl">💗</span>
    </div>
  </motion.div>;
}

function App(){
  const [s,setS]=useState('ask');const [reset,setReset]=useState(false);const [music,setMusic]=useLofi();
  const doReset=()=>{setReset(true);setTimeout(()=>{setS('ask');setReset(false)},1400)};
  return <div className="relative h-full w-full flex items-center justify-center p-4 overflow-hidden">
    <Floaters/>
    <motion.button onClick={()=>setMusic(!music)} aria-label="موسيقى" whileHover={{scale:1.2}} whileTap={{scale:.8}} className="fixed top-4 left-4 z-40 w-12 h-12 rounded-full bg-white/80 border-[3px] border-kitty text-2xl shadow-lg" style={{marginTop:'env(safe-area-inset-top,0px)'}}
      animate={music?{rotate:[0,-12,12,0]}:{}} transition={{repeat:music?Infinity:0,duration:1.2}}>{music?'🎵':'🔇'}</motion.button>

    {s!=='sureYes'&&<motion.div layout className="paper relative z-10 w-full max-w-md px-5 py-8 sm:px-8 sm:py-10 flex flex-col items-center gap-6 max-h-full overflow-y-auto">
      <motion.div animate={{y:[0,-8,0]}} transition={{repeat:Infinity,duration:2.4}}><Cat className="w-24 sm:w-28"/></motion.div>
      <AnimatePresence mode="wait">
        <motion.div key={s} {...pop} className="w-full flex flex-col items-center gap-6">
          {s==='ask'&&<><Title>هل انتِ سارا؟</Title><div className="flex gap-4"><Btn onClick={()=>setS('gift')}>اي</Btn><Btn alt onClick={()=>setS('sure')}>لا</Btn></div></>}
          {s==='gift'&&<><Title>لديك هديه من عبدالله 🎁</Title><div className="flex gap-4"><Btn onClick={()=>setS('video')}>استلام</Btn><Btn alt onClick={()=>setS('tease')}>رفض</Btn></div></>}
          {s==='tease'&&<><Title shake>مو بكيفج 😂</Title><Btn onClick={()=>setS('video')}>استلام</Btn></>}
          {s==='video'&&<VideoBox/>}
          {s==='sure'&&<><Title>متأكدة؟ 🤔</Title><div className="flex gap-4"><AnimatePresence><Btn key="y" onClick={()=>setS('sureYes')}>اي</Btn></AnimatePresence><Btn alt layoutId="no-btn" onClick={()=>setS('ask')}>لا</Btn></div></>}
        </motion.div>
      </AnimatePresence>
    </motion.div>}

    {s==='sureYes'&&<div className="fixed inset-0 z-20 flex items-center justify-center">
      <Btn alt layoutId="no-btn" onClick={doReset} animate={{scale:[1.5,1.75,1.5]}} transition={{scale:{repeat:Infinity,duration:1.2},layout:{type:'spring',stiffness:120,damping:16}}} style={{fontSize:'1.6rem'}}>لا</Btn>
    </div>}

    <AnimatePresence>{reset&&<motion.div className="fixed inset-0 z-40 flex items-center justify-center" style={{background:'rgba(255,240,245,.85)'}} initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}}>
      {[0,1,2,3,4,5].map(i=><motion.span key={i} className="absolute text-4xl" style={{color:'#ff4fa3',filter:'drop-shadow(0 0 10px #ff4fa3)'}} initial={{rotate:0,scale:0,x:0,y:0}} animate={{rotate:720,scale:[0,1.4,0],x:Math.cos(i*1.05)*110,y:Math.sin(i*1.05)*110}} transition={{duration:1.3,ease:'easeInOut'}}>♥</motion.span>)}
      <motion.div animate={{rotate:360,scale:[1,1.4,1]}} transition={{duration:1.3}} className="text-6xl">✨</motion.div>
    </motion.div>}</AnimatePresence>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
